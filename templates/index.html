<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Submit Form</title>
  <style>
    /* Basic page setup */
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* Card container */
    .form-container {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 350px;
      padding: 30px;
      text-align: center;
      transition: transform 0.2s ease-in-out;
    }

    .form-container:hover {
      transform: scale(1.02);
    }

    /* Header */
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }

    /* Form styling */
    form {
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    label {
      text-align: left;
      margin-bottom: 10px;
      font-weight: 500;
      color: #444;
    }

    input[type="text"],
    input[type="email"] {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
      margin-bottom: 15px;
      transition: border 0.3s;
    }

    input:focus {
      border-color: #007bff;
    }

    /* Button styling */
    button {
      background: #007bff;
      color: #fff;
      font-size: 16px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    button:hover {
      background: #0056b3;
      transform: translateY(-2px);
    }

    /* Message box */
    #message {
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 400px) {
      .form-container {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Submit Your Details</h1>

    <form id="myForm" onsubmit="return false;">
      <label>
        Name:
        <input type="text" id="name" required />
      </label>

      <label>
        Email:
        <input type="email" id="email" required />
      </label>

      <button id="submitBtn">Submit</button>
    </form>

    <div id="message"></div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
